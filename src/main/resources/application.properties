spring.application.name=baozistore

# Configuracao do banco de dados H2
spring.datasource.url=jdbc:h2:file:./dados/baozistore
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Criar e atualizar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Desabilitar Open in View
spring.jpa.open-in-view=false

# Habilitar o console do H2
spring.h2.console.enabled=true
